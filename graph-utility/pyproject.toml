[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-utility"
version = "0.1.0"
description = "Generic, multi-BU Ontology-Mediated Data Access (OMDA) utility for AgentControl"
requires-python = ">=3.10"
dependencies = [
  "boto3>=1.34.0",
  "requests>=2.31.0",
]

[project.optional-dependencies]
serving = ["mlflow>=2.12.0", "pandas>=2.0.0"]
# Reading a SUPPLIED ontology file needs an RDF parser. Kept optional so the
# Neptune path, the precision path and materialisation stay stdlib-only —
# `materialize.py` writes N-Quads by hand precisely so emitting a graph does
# not depend on this.
ontology = ["rdflib>=7.0"]
# Loading a build into Neo4j (`neo4j_load.py`). Parsing the N-Quads uses rdflib.
neo4j = ["neo4j>=5.20", "rdflib>=7.0"]
# pyspark + databricks-vectorsearch are provided by the Databricks runtime.

[tool.setuptools.packages.find]
where = ["src"]
