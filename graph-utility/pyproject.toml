[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-utility"
version = "0.1.0"
description = "Generic, multi-BU Ontology-Mediated Data Access (OMDA) utility for AgentControl"
requires-python = ">=3.10"
dependencies = [
  "boto3>=1.34.0",
  "requests>=2.31.0",
]

[project.optional-dependencies]
serving = ["mlflow>=2.12.0", "pandas>=2.0.0"]
# pyspark + databricks-vectorsearch are provided by the Databricks runtime.

[tool.setuptools.packages.find]
where = ["src"]
